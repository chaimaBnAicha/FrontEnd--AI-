

<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4>All Leave Requests</h4>
            <a routerLink="/admin/leave-calendar" class="btn btn-light">
                <i class="fas fa-calendar-alt"></i> View Calendar
            </a>
        </div>
        <div class="card-body">
            <div class="row mb-4">
                <div class="col-md-8">
                    <div class="input-group shadow-sm">
                        <input 
                            type="text" 
                            class="form-control"
                            placeholder="Search by reason or type..." 
                            [(ngModel)]="searchTerm"
                            (keyup)="onSearch()">
                        <div class="input-group-append" *ngIf="searchTerm">
                            <button class="btn btn-outline-secondary" (click)="clearSearch()">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <select class="form-control shadow-sm" 
                            [(ngModel)]="statusFilter" 
                            (change)="onStatusFilter()">
                        <option value="">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Type</th>
                            <th>Reason</th>
                            <th>Document</th>
                            <th>Status</th>
                            <th>AI Analysis</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let leave of leaves | paginate: { itemsPerPage: itemsPerPage, currentPage: p }">
                            <td>{{ leave.start_date | date:'mediumDate' }}</td>
                            <td>{{ leave.end_date | date:'mediumDate' }}</td>
                            <td>{{ leave.type }}</td>
                            <td [innerHTML]="leave.reason | safeHtml"></td>
                            <td>
                                <div *ngIf="leave.documentAttachement">
                                    <button class="btn btn-primary btn-sm" 
                                            (click)="downloadDocument(leave)"
                                            [disabled]="leave.isDownloading">
                                        <i class="fas" [ngClass]="{'fa-download': !leave.isDownloading, 'fa-spinner fa-spin': leave.isDownloading}"></i>
                                        {{leave.isDownloading ? 'Downloading...' : ''}}
                                    </button>
                                </div>
                                <div *ngIf="leave.downloadError" class="text-danger small mt-1">
                                    Failed to download document
                                </div>
                            </td>
                            <td>
                                <span class="badge" [ngClass]="{
                                    'badge-warning': leave.status === 'Pending',
                                    'badge-success': leave.status === 'Approved',
                                    'badge-danger': leave.status === 'Rejected'
                                }">
                                    {{ leave.status }}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-info btn-sm" 
                                        type="button" 
                                        (click)="openAiModal(leave)"
                                        title="View AI Analysis"
                                        [disabled]="!aiAnalysis[leave.id?.toString() || '']">
                                    <i class="fas fa-brain"></i>
                                    <span class="d-none d-md-inline ml-1">Analysis</span>
                                </button>
                            </td>
                            <td>
                                <div class="btn-group" role="group" aria-label="Leave actions">
                                    <button class="btn btn-outline-success btn-sm d-flex align-items-center" 
                                            (click)="updateStatus(leave, LeaveStatus.APPROVED)"
                                            [disabled]="leave.status === LeaveStatus.APPROVED || leave.status === LeaveStatus.REJECTED || isLoading(leave)"
                                            title="Approve Leave">
                                        <i class="fas" [ngClass]="{'fa-check': !isLoading(leave), 'fa-spinner fa-spin': isLoading(leave)}"></i>
                                        <span class="d-none d-md-inline ml-1">Approve</span>
                                    </button>
                                    <button class="btn btn-outline-danger btn-sm d-flex align-items-center" 
                                            (click)="updateStatus(leave, LeaveStatus.REJECTED)"
                                            [disabled]="leave.status === LeaveStatus.REJECTED || leave.status === LeaveStatus.APPROVED"
                                            title="Reject Leave">
                                        <i class="fas fa-times"></i>
                                        <span class="d-none d-md-inline ml-1">Reject</span>
                                    </button>
                                </div>
                            </td>
                            
                        </tr>
                    </tbody>
                </table>
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <div>
                        <select class="form-control" [(ngModel)]="itemsPerPage" (change)="onItemsPerPageChange()">
                            <option value="5">5 items</option>
                            <option value="10">10 items</option>
                            <option value="20">20 items</option>
                        </select>
                    </div>
                    <pagination-controls
                        (pageChange)="p = $event"
                        class="my-pagination">
                    </pagination-controls>
                </div>
            </div>
        </div>
    </div>
</div>
